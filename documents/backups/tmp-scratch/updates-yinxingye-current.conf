# Install as /etc/nginx/sites-available/updates.yinxingye.space.conf and enable it.
# The matching webroot is /var/www/updates.
server {
    listen 80;
    listen [::]:80;
    server_name updates.yinxingye.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/updates;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name updates.yinxingye.space;

    ssl_certificate /etc/letsencrypt/live/updates.yinxingye.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.yinxingye.space/privkey.pem;

    root /var/www/updates;
    access_log /var/log/nginx/updates.access.log;
    error_log /var/log/nginx/updates.error.log;

    location = /latest.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/apps/[a-z0-9][a-z0-9_-]*/latest\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/apps/[a-z0-9][a-z0-9_-]*/versions/[0-9]+\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/apps/[a-z0-9][a-z0-9_-]*/apk/[A-Za-z0-9][A-Za-z0-9._-]*\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /apk/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        return 404;
    }
}
